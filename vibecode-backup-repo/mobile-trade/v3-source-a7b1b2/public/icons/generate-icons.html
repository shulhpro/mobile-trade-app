<!DOCTYPE html>
<html>
<head>
  <title>Generate Icons</title>
</head>
<body>
  <canvas id="canvas" width="512" height="512"></canvas>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    // Draw icon
    ctx.fillStyle = '#2c5aa0';
    ctx.fillRect(0, 0, 512, 512);
    
    // Draw phone icon
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.roundRect(156, 56, 200, 400, 30);
    ctx.fill();
    
    // Screen
    ctx.fillStyle = '#2c5aa0';
    ctx.beginPath();
    ctx.roundRect(176, 96, 160, 280, 10);
    ctx.fill();
    
    // Home button
    ctx.fillStyle = '#2c5aa0';
    ctx.beginPath();
    ctx.arc(256, 416, 20, 0, Math.PI * 2);
    ctx.fill();
    
    // Location pin
    ctx.fillStyle = '#ff6b6b';
    ctx.beginPath();
    ctx.arc(256, 200, 40, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(256, 200, 20, 0, Math.PI * 2);
    ctx.fill();
    
    // Download
    const link = document.createElement('a');
    link.download = 'icon-512x512.png';
    link.href = canvas.toDataURL();
    link.click();
  </script>
</body>
</html>
