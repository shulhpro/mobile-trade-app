<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#16213e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Полевые визиты</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header">
      <div class="header-content">
        <h1>📍 Полевые визиты</h1>
        <div class="user-info" id="userInfo">
          <span class="user-avatar">👤</span>
          <span class="user-name">Загрузка...</span>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Step 1: Company Selection -->
      <section id="step-company" class="step active">
        <div class="step-header">
          <h2>Выбор клиента</h2>
          <p class="step-description">Выберите компанию для визита</p>
        </div>
        
        <div class="search-box">
          <input type="text" id="companySearch" placeholder="🔍 Поиск по названию..." class="search-input">
        </div>
        
        <div id="companiesList" class="companies-list">
          <!-- Companies will be loaded here -->
        </div>
        
        <div id="companyCard" class="company-card hidden">
          <div class="card-header">
            <h3 id="selectedCompanyName"></h3>
            <button class="btn-close" onclick="closeCompanyCard()">✕</button>
          </div>
          <div class="card-body">
            <p class="company-address">📍 <span id="selectedCompanyAddress"></span></p>
            <p class="company-phone">📞 <span id="selectedCompanyPhone"></span></p>
          </div>
          <div class="card-footer">
            <button class="btn-primary" onclick="selectCompany()">✓ Выбрать этого клиента</button>
          </div>
        </div>
      </section>

      <!-- Step 2: Visit Form -->
      <section id="step-visit" class="step">
        <div class="step-header">
          <h2>Форма визита</h2>
          <p class="step-description">Заполните данные о визите</p>
        </div>
        
        <div class="visit-form">
          <!-- GPS Coordinates -->
          <div class="form-section">
            <h3>📍 GPS-координаты</h3>
            <div id="gpsStatus" class="gps-status">
              <button class="btn-secondary" onclick="getGPS()">Определить местоположение</button>
            </div>
            <div id="gpsCoords" class="gps-coords hidden"></div>
          </div>
          
          <!-- Photos -->
          <div class="form-section">
            <h3>📸 Фотографии (<span id="photoCount">0</span>/10)</h3>
            <div class="photo-section">
              <input type="file" id="photoInput" accept="image/*" capture="environment" multiple style="display: none;">
              <button class="btn-camera" onclick="document.getElementById('photoInput').click()">
                <span class="camera-icon">📷</span>
                <span>Добавить фото</span>
              </button>
              <div id="photosPreview" class="photos-preview"></div>
            </div>
          </div>
          
          <!-- Notes -->
          <div class="form-section">
            <h3>📝 Заметки</h3>
            <textarea id="visitNotes" class="notes-input" placeholder="Введите заметки о визите..."></textarea>
          </div>
          
          <!-- Products -->
          <div class="form-section">
            <h3>🛒 Заказ</h3>
            <button class="btn-secondary" onclick="showCatalog()">+ Добавить товары</button>
            <div id="selectedProducts" class="selected-products"></div>
          </div>
        </div>
        
        <div class="form-actions">
          <button class="btn-save" onclick="saveVisit()">💾 Сохранить</button>
          <button class="btn-complete" onclick="completeVisit()">✓ Завершить визит</button>
        </div>
      </section>

      <!-- Catalog Modal -->
      <div id="catalogModal" class="modal hidden">
        <div class="modal-content">
          <div class="modal-header">
            <h3>Каталог товаров</h3>
            <button class="btn-close" onclick="closeCatalog()">✕</button>
          </div>
          
          <div id="catalogSections" class="catalog-sections">
            <!-- Sections will be loaded here -->
          </div>
          
          <div id="catalogProducts" class="catalog-products hidden">
            <button class="btn-back" onclick="backToSections()">← Назад к разделам</button>
            <div id="productsList" class="products-list"></div>
          </div>
          
          <div class="modal-footer">
            <button class="btn-primary" onclick="addSelectedProducts()">Добавить выбранные</button>
          </div>
        </div>
      </div>

      <!-- Success Message -->
      <div id="successMessage" class="success-message hidden">
        <div class="success-content">
          <div class="success-icon">✓</div>
          <h3>Визит сохранен!</h3>
          <p id="successText"></p>
          <button class="btn-primary" onclick="startNewVisit()">Новый визит</button>
        </div>
      </div>
    </main>

    <!-- Navigation -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-step="company">
        <span class="nav-icon">🏢</span>
        <span class="nav-label">Клиент</span>
      </button>
      <button class="nav-item" data-step="visit">
        <span class="nav-icon">📋</span>
        <span class="nav-label">Визит</span>
      </button>
    </nav>
  </div>

  <script src="/app.js"></script>
</body>
</html>
