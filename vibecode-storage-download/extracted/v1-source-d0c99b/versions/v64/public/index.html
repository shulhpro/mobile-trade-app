<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a73e8">
  <title>Мобильная торговля</title>
  <link rel="stylesheet" href="style.css?v=64">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header">
      <h1>📱 Мобильная торговля</h1>
      <div class="header-actions">
        <button class="btn-refresh" onclick="clearCacheAndReload()" title="Обновить приложение">
          🔄
        </button>
        <div class="user-info" id="userInfo"></div>
      </div>
    </header>

    <!-- Project Selector -->
    <div id="projectSelectorContainer" style="display: none;">
      <div class="project-selector">
        <label for="projectSelect">📁 Проект:</label>
        <select id="projectSelect">
          <option value="">-- Выберите проект --</option>
        </select>
      </div>
    </div>

    <!-- Main Content -->
    <main class="app-main">
      <!-- Company Selection Screen -->
      <section id="companyScreen" class="screen active">
        <div class="search-box">
          <input type="text" id="companySearch" placeholder="🔍 Поиск компании...">
        </div>
        <div class="companies-list" id="companiesList">
          <div class="loading">Загрузка компаний...</div>
        </div>
      </section>

      <!-- Company Detail Screen -->
      <section id="companyDetailScreen" class="screen">
        <button class="btn-back" onclick="showScreen('companyScreen')">← Назад к списку</button>
        <div class="company-detail" id="companyDetail"></div>
        <button class="btn-start-visit" onclick="startVisit()">
          <span>📍</span>
          <span>Начать /<br>Продолжить визит</span>
        </button>
      </section>

      <!-- Visit Form Screen -->
      <section id="visitScreen" class="screen">
        <button class="btn-back" onclick="showScreen('companyDetailScreen')">← Назад к компании</button>
        <div class="visit-form">
          <h2 id="visitCompanyName"></h2>
          
          <!-- GPS -->
          <div class="form-section">
            <h3>📍 GPS-координаты</h3>
            <button class="btn-gps" onclick="getGPS()">Определить местоположение</button>
            <div id="gpsResult" class="gps-result"></div>
          </div>

          <!-- Photos -->
          <div class="form-section">
            <h3>📸 Фото</h3>
            <input type="file" id="photoInput" accept="image/*" multiple capture="environment" style="display: none;">
            <button class="btn-photo" onclick="document.getElementById('photoInput').click()">Добавить фото</button>
            <div id="photoPreview" class="photo-preview"></div>
          </div>

          <!-- Notes -->
          <div class="form-section">
            <h3>📝 Заметки</h3>
            <textarea id="noteText" rows="4" placeholder="Введите заметки..."></textarea>
          </div>

          <!-- Order -->
          <div class="form-section">
            <h3>📦 Заказ</h3>
            <button class="btn-order" onclick="showOrderModal()">Добавить товары</button>
            <div id="orderSummary" class="order-summary"></div>
          </div>

          <!-- Actions -->
          <div class="form-actions">
            <button class="btn-save" onclick="saveVisit()">💾 Сохранить</button>
            <button class="btn-close" onclick="closeVisit()">✅ Завершить визит</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Order Modal -->
  <div id="orderModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>📦 Выбор товаров</h2>
        <button class="btn-close-modal" onclick="closeOrderModal()">✕</button>
      </div>
      <div id="sectionsList" class="sections-list"></div>
      <div id="productsList" class="products-list" style="display: none;"></div>
      <div id="orderItems" class="order-items"></div>
      <div class="modal-footer">
        <button class="btn-back-sections" onclick="showSections()" style="display: none;">← Назад к разделам</button>
        <button class="btn-confirm-order" onclick="confirmOrder()">✓ Подтвердить заказ</button>
      </div>
    </div>
  </div>

  <!-- Loading Overlay -->
  <div id="loadingOverlay" class="loading-overlay" style="display: none;">
    <div class="loading-spinner"></div>
    <div class="loading-text">Сохранение...</div>
  </div>

  <script src="app.js?v=64"></script>
</body>
</html>
