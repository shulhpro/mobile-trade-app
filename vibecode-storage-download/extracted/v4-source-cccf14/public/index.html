<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2196F3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Мобильная торговля</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192x192.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header">
      <div class="header-content">
        <h1>📱 Мобильная торговля</h1>
        <div class="header-actions">
          <button id="dashboardBtn" class="icon-btn" title="Аналитика">📊</button>
          <button id="refreshBtn" class="icon-btn" title="Обновить">🔄</button>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Loading Screen -->
      <div id="loadingScreen" class="screen active">
        <div class="loading-spinner"></div>
        <p>Загрузка...</p>
      </div>

      <!-- Client Selection Screen -->
      <div id="clientScreen" class="screen">
        <div class="screen-header">
          <h2>Выберите клиента</h2>
          <div class="search-box">
            <input type="text" id="clientSearch" placeholder="🔍 Поиск по названию...">
          </div>
        </div>
        <div id="clientsList" class="clients-list"></div>
      </div>

      <!-- Visit Form Screen -->
      <div id="visitScreen" class="screen">
        <div class="screen-header">
          <button id="backToClients" class="back-btn">← Назад</button>
          <h2 id="visitClientName">Визит</h2>
        </div>
        
        <div class="visit-form">
          <!-- GPS Coordinates -->
          <div class="form-section">
            <label>📍 GPS-координаты</label>
            <div id="gpsCoords" class="gps-display">Определение...</div>
            <button id="getGpsBtn" class="btn-secondary">Обновить координаты</button>
          </div>

          <!-- Photos -->
          <div class="form-section">
            <label>📸 Фотографии (<span id="photoCount">0</span>/10)</label>
            <div id="photosPreview" class="photos-preview"></div>
            <input type="file" id="photoInput" accept="image/*" capture="environment" multiple style="display: none;">
            <button id="addPhotoBtn" class="btn-secondary">📷 Добавить фото</button>
          </div>

          <!-- Notes -->
          <div class="form-section">
            <label>📝 Заметки</label>
            <textarea id="visitNotes" rows="4" placeholder="Введите заметки о визите..."></textarea>
          </div>

          <!-- Order -->
          <div class="form-section">
            <label>📦 Заказ</label>
            <div id="orderSummary" class="order-summary">
              <p>Товаров: <span id="orderItemsCount">0</span></p>
              <p>Сумма: <span id="orderTotal">0</span> ₽</p>
            </div>
            <button id="addOrderBtn" class="btn-secondary">➕ Добавить товары</button>
          </div>

          <!-- Action Buttons -->
          <div class="form-actions">
            <button id="saveVisitBtn" class="btn-primary">💾 Сохранить</button>
            <button id="completeVisitBtn" class="btn-success">✅ Завершить визит</button>
          </div>
        </div>
      </div>

      <!-- Product Selection Screen -->
      <div id="productsScreen" class="screen">
        <div class="screen-header">
          <button id="backToVisit" class="back-btn">← Назад к визиту</button>
          <h2>Выбор товаров</h2>
        </div>
        
        <div id="sectionsView" class="sections-view">
          <h3>Разделы каталога</h3>
          <div id="sectionsList" class="sections-list"></div>
        </div>
        
        <div id="productsView" class="products-view" style="display: none;">
          <button id="backToSections" class="back-btn">← Назад к разделам</button>
          <h3 id="currentSectionName">Товары</h3>
          <div id="productsList" class="products-list"></div>
        </div>
        
        <div id="cartView" class="cart-view">
          <h3>🛒 Корзина</h3>
          <div id="cartItems" class="cart-items"></div>
          <div class="cart-total">
            <strong>Итого: <span id="cartTotal">0</span> ₽</strong>
          </div>
          <button id="confirmOrderBtn" class="btn-primary">✓ Подтвердить заказ</button>
        </div>
      </div>

      <!-- Dashboard Screen -->
      <div id="dashboardScreen" class="screen">
        <div class="screen-header">
          <button id="backFromDashboard" class="back-btn">← Назад</button>
          <h2>📊 Аналитика</h2>
        </div>
        
        <div class="dashboard-filters">
          <div class="filter-row">
            <label>С:</label>
            <input type="date" id="dateFrom">
          </div>
          <div class="filter-row">
            <label>По:</label>
            <input type="date" id="dateTo">
          </div>
          <button id="applyFilterBtn" class="btn-secondary">Применить</button>
        </div>
        
        <div class="dashboard-summary">
          <div class="summary-card">
            <div class="summary-value" id="totalVisits">0</div>
            <div class="summary-label">Визитов</div>
          </div>
          <div class="summary-card">
            <div class="summary-value" id="totalOrders">0</div>
            <div class="summary-label">Заказов</div>
          </div>
          <div class="summary-card">
            <div class="summary-value" id="totalAmount">0 ₽</div>
            <div class="summary-label">Сумма</div>
          </div>
        </div>
        
        <div class="dashboard-tables">
          <div class="table-section">
            <h3>По сотрудникам</h3>
            <div id="employeeTable" class="data-table"></div>
          </div>
          
          <div class="table-section">
            <h3>По клиентам</h3>
            <div id="clientTable" class="data-table"></div>
          </div>
        </div>
      </div>
    </main>

    <!-- Loading Modal -->
    <div id="loadingModal" class="modal">
      <div class="modal-content">
        <div class="loading-spinner"></div>
        <p id="loadingText">Сохранение...</p>
      </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast" class="toast"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
