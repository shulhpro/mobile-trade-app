<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a73e8">
  <title>Мобильная торговля</title>
  <link rel="stylesheet" href="style.css?v=2">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header">
      <h1>📱 Мобильная торговля</h1>
      <div class="user-info" id="userInfo"></div>
    </header>

    <!-- Main Content -->
    <main class="app-main">
      <!-- Company Selection Screen -->
      <section id="companyScreen" class="screen active">
        <div class="search-box">
          <input type="text" id="companySearch" placeholder="🔍 Поиск компании...">
        </div>
        <div class="companies-list" id="companiesList">
          <div class="loading">Загрузка компаний...</div>
        </div>
      </section>

      <!-- Company Detail Screen -->
      <section id="companyDetailScreen" class="screen">
        <button class="btn-back" onclick="showScreen('companyScreen')">← Назад к списку</button>
        <div class="company-card" id="companyCard"></div>
        
        <div class="actions-grid">
          <button class="action-btn visit" onclick="showVisitForm()">
            <span class="icon">📍</span>
            <span class="label">Начать /<br>Продолжить визит</span>
          </button>
        </div>
      </section>

      <!-- Unified Visit Form -->
      <section id="visitFormScreen" class="screen">
        <button class="btn-back" onclick="showScreen('companyDetailScreen')">← Назад</button>
        <h2>📝 Визит к клиенту</h2>
        <form id="visitForm" class="action-form">
          <div class="form-group">
            <label>Компания</label>
            <div id="visitCompanyName" class="company-name-display"></div>
          </div>

          <!-- Location Section -->
          <div class="form-section">
            <h3>📍 Местоположение</h3>
            <button type="button" class="btn-location" onclick="getLocation()">
              📍 Определить местоположение
            </button>
            <div id="locationDisplay" class="location-display"></div>
          </div>

          <!-- Photos Section -->
          <div class="form-section">
            <h3>📸 Фотоотчет</h3>
            <input type="file" id="photoInput" accept="image/*" multiple capture="environment">
            <div id="photoPreview" class="photo-preview"></div>
          </div>

          <!-- Notes Section -->
          <div class="form-section">
            <h3>📝 Заметки</h3>
            <textarea id="noteText" rows="4" placeholder="Введите заметки по визиту..."></textarea>
          </div>

          <!-- Order Section -->
          <div class="form-section">
            <h3>📦 Заказ</h3>
            <div id="productsList" class="products-list">
              <div class="loading">Загрузка товаров...</div>
            </div>
            <div class="order-summary">
              <div class="total">Итого: <span id="orderTotal">0</span> ₽</div>
            </div>
          </div>

          <!-- Comment Section -->
          <div class="form-section">
            <h3>💬 Общий комментарий</h3>
            <textarea id="visitComment" rows="3" placeholder="Общий комментарий к визиту..."></textarea>
          </div>

          <!-- Action Buttons -->
          <div class="form-actions">
            <button type="button" class="btn-save" onclick="submitVisit(false)">
              💾 Сохранить данные
            </button>
            <button type="button" class="btn-close" onclick="submitVisit(true)">
              ✅ Завершить визит
            </button>
          </div>
        </form>
      </section>

      <!-- Success Screen -->
      <section id="successScreen" class="screen">
        <div class="success-message">
          <div class="success-icon">✅</div>
          <h2 id="successTitle">Успешно!</h2>
          <p id="successMessage">Данные сохранены</p>
          <button class="btn-submit" onclick="showScreen('companyDetailScreen')">Вернуться к компании</button>
        </div>
      </section>
    </main>

    <!-- Toast Notifications -->
    <div id="toast" class="toast"></div>
  </div>

  <script src="app.js?v=2"></script>
</body>
</html>
